name: Playwright Container Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:  

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Playwright Docker image
        run: docker build -t web-e2e .

      - name: Run Playwright tests
        run: |
          docker run \
            --name web-e2e-run \
            --ipc=host \
            -e CI=true \
            -e BASE_URL="${{ vars.TEST_BASE_URL }}" \
            web-e2e \
            npx playwright test --project=chromium --grep "@smoke"

      - name: Copy Playwright artifacts
        if: always()
        run: |
          docker cp web-e2e-run:/app/playwright-report ./playwright-report || true
          docker cp web-e2e-run:/app/test-results ./test-results || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14